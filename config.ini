; Instellingen voor de teller. Pas dit bestand aan en het script volgt.
; Regels die met ; beginnen zijn uitleg en worden genegeerd.

[filter]
; Naam van de (sub)taak in AdminPulse die geteld wordt.
taaknaam = Neerlegging jaarrekening

; exact  = de naam moet precies overeenkomen (hoofdletters maken niet uit)
; bevat  = de naam moet de tekst hierboven bevatten (bv. ook "Neerlegging jaarrekening NBB")
vergelijking = exact

; Enkel taken van dit referentiejaar (boekjaar) meetellen. Leeg = alle jaren.
referentiejaar =

; Enkel taken met een deadline in deze periode meetellen (formaat dd/mm/jjjj).
; Het gaat om de deadline van de taak hierboven zelf (de neerlegging).
; Leeg = geen ondergrens of geen bovengrens. Bv.:  deadline_van = 01/01/2026  en  deadline_tot = 31/12/2026
deadline_van = 01/01/2026
deadline_tot = 31/08/2026

; Hoe ver terug het script taken ophaalt bij AdminPulse (enkel om het snel te houden).
; Leeg = automatisch 1 januari van vorig jaar. Zet "alles" om geen grens te gebruiken (trager).
ophalen_vanaf =

[pagina]
titel = Nog neer te leggen jaarrekeningen
ondertitel = Jaarrekeningen die nog niet neergelegd zijn bij de Balanscentrale
; Tekst die verschijnt als de teller op 0 staat
nul_boodschap = Alles is neergelegd.
; Hoe vaak de pagina zichzelf ververst, in minuten
ververs_minuten = 5
; Na hoeveel uur zonder update de pagina een waarschuwing toont
verouderd_na_uur = 3

[aftelklok]
; Datum en uur (Belgische tijd) waarnaar afgeteld wordt, formaat dd/mm/jjjj uu:mm:ss. Leeg = geen aftelklok.
tot = 31/08/2026 23:59:59
; Tekst boven de klok
tekst = tot de deadline van 31 augustus
; Tekst als het moment voorbij is
verstreken_tekst = De deadline van 31 augustus is verstreken.

[citaten]
; De quotes zelf staan in citaten.txt (één per regel). Telkens het cijfer daalt, verschijnt de volgende.
; Deze quote verschijnt als de teller op 0 staat:
bij_nul = Nul. Het mooiste getal in de boekhouding. Ga naar buiten, het is nog even zomer.
